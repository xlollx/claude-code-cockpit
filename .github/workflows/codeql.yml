# GitHub's code scanning for the hooks module (TypeScript): injection, unsafe paths, secrets in code.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
      # the findings also as a downloadable file, readable without access to the Security tab
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 14
